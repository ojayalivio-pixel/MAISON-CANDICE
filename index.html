<!doctype html>
<html lang=“en”>
<head>
<meta charset=“utf-8”>
<meta name=“viewport” content=“width=device-width,initial-scale=1”>
<meta name=“description” content=“Ferragamo — a luxury digital experience.”>
<title>CANDICE FERRARAMO</title>
<style>
:root{—bg:#080808;—panel:#101010;—line:#2a2927;—gold:#d5bb83;—text:#f4efe6;—muted:#aaa49a}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(—bg);color:var(—text);font-family:Arial,Helvetica,sans-serif}
a{text-decoration:none;color:inherit}.serif{font-family:Georgia,’Times New Roman’,serif}.wrap{width:min(1180px,92%);margin:auto}
nav{height:76px;display:flex;align-items:center;justify-content:space-between;position:fixed;top:0;width:100%;z-index:20;padding:0 4%;background:#080808dd;backdrop-filter:blur(16px);border-bottom:1px solid var(—line)}
.brand{letter-spacing:.28em;font-size:12px}.navlinks{display:flex;gap:20px;font-size:10px;letter-spacing:.13em;color:#c8c2b7}
.hero{min-height:100vh;display:flex;align-items:end;padding:150px 0 90px;background:radial-gradient(circle at 78% 22%,#4b412e 0%,transparent 30%),radial-gradient(circle at 20% 75%,#1d1811 0%,transparent 25%),linear-gradient(120deg,#080808,#16130f 60%,#080808)}
.eyebrow{color:var(—gold);font-size:11px;letter-spacing:.25em}.hero h1{font-size:clamp(60px,10vw,145px);line-height:.86;font-weight:400;margin:22px 0}.hero p{max-width:620px;color:#c6c0b6;line-height:1.8;font-size:15px}
.btn{display:inline-block;border:1px solid var(—gold);padding:15px 21px;margin:12px 8px 0 0;font-size:10px;letter-spacing:.16em;transition:.25s}.btn:hover{background:var(—gold);color:#111}
section{padding:105px 0;border-top:1px solid var(—line)}h2{font-size:clamp(38px,6vw,76px);font-weight:400;margin:12px 0 25px}.lead{max-width:760px;color:var(—muted);line-height:1.9}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:38px}.card{background:var(—panel);border:1px solid var(—line);padding:24px;min-height:185px}.card h3{font-family:Georgia,serif;font-size:23px;font-weight:400;margin:0 0 13px}.card p{font-size:13px;color:var(—muted);line-height:1.7}
.media{height:330px;background:linear-gradient(145deg,#27231d,#0e0e0e);border:1px solid var(—line);display:flex;align-items:end;padding:18px;color:#c9bfae;font-size:10px;letter-spacing:.14em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:60px}.location{font-size:clamp(30px,4vw,55px);font-family:Georgia,serif}
footer{padding:60px 0;color:#827d74;font-size:11px;letter-spacing:.08em}
@media(max-width:850px){.navlinks{display:none}.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr;gap:25px}section{padding:75px 0}}
</style>
</head>
<body>
<nav>
<a class=“brand serif” href=“#home”>MAISON FERRARAMO</a>
<div class=“navlinks”><a href=“#ferragamo”>FERRAGAMO</a><a href=“#experiences”>EXPERIENCES</a><a href=“#gallery”>GALLERY</a><a href=“#videos”>VIDEOS</a><a href=“#travel”>TRAVEL</a><a href=“#contact”>CONTACT</a></div>
</nav>

<main>
<section class=“hero” id=“home”>
<div class=“wrap”>
<div class=“eyebrow”>EXCLUSIVE · ELEGANT · INTERNATIONAL</div>
<h1 class=“serif”>WELCOME TO<br>MAISON FERRARAMO</h1>
<p>A private world of digital experiences, personal connection, and unforgettable moments.</p>
</section>
</main>
